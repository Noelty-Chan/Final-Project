<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f7f4">
  <title>Sign in · Inspo Quote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="signin.js" type="module"></script>
</head>

<body class="auth-page">
  <main class="auth-page-shell">
    <a class="brand auth-page-brand" href="index.html"><span class="brand-mark">iq.</span><span>Inspo Quote</span></a>
    <section class="auth-page-card" aria-labelledby="page-auth-title">
      <div class="eyebrow"><span class="eyebrow-line"></span><span id="page-auth-eyebrow">YOUR PERSONAL
          COLLECTION</span></div>
      <h1 id="page-auth-title">Make room for<br><em>what moves you.</em></h1>
      <p class="auth-page-description" id="page-auth-description">Create a free account to keep your favorite words
        close.</p>
      <form id="page-auth-form">
        <label for="page-auth-email">Email address</label>
        <input id="page-auth-email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="page-auth-password">Password</label>
        <input id="page-auth-password" type="password" autocomplete="new-password" placeholder="At least 6 characters"
          minlength="6" required>
        <p class="page-auth-error" id="page-auth-error" aria-live="polite"></p>
        <button class="dark-button" id="page-auth-submit" type="submit">Create my account</button>
      </form>
      <p class="auth-page-switch" id="page-auth-switch">Already have an account? <button type="button"
          id="page-switch-button">Sign in</button></p>
      <a class="auth-back-link" href="index.html">Back to the quote generator</a>
    </section>
    <p class="auth-page-footer">© 2026 Inspo Quote. All rights reserved.</p>
  </main>
</body>

</html>
